
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Exam Prep Quiz</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="global.css">
</head>

<body>

  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">
        <i class="bi bi-journal-check me-2"></i>
        Exam Prep Quiz
      </span>
    </div>
  </nav>

  <main class="container pb-5">

    <h5 class="section-title mb-3">Select a Chapter</h5>

    <!-- Dynamic Quiz Cards -->
    <div class="chapter-list" id="chapterList"></div>

  </main>

  <script>

    // =================================
    // QUIZ CHAPTER DATA
    // =================================

    const quizChapters = [

      {
        id: 100101,
        title: "Indian Polity & Constitution",
        description: "Fundamental Rights, Articles & Amendments",
        icon: "bi-bank",
        color: "color-yellow"
      },

      {
        id: 100102,
        title: "Indian Geography",
        description: "Rivers, National Parks & Physiography",
        icon: "bi-globe-asia-australia",
        color: "color-blue"
      },

      {
        id: 100103,
        title: "Indian History",
        description: "Ancient, Medieval & Modern History",
        icon: "bi-clock-history",
        color: "color-pink"
      },

      {
        id: 100104,
        title: "Mathematics",
        description: "Arithmetic, Algebra & Geometry",
        icon: "bi-calculator",
        color: "color-purple"
      },

      {
        id: 100105,
        title: "General Science",
        description: "Physics, Chemistry & Biology",
        icon: "bi-lightbulb",
        color: "color-orange"
      },

      {
        id: 100106,
        title: "Static GK",
        description: "Important Facts & General Knowledge",
        icon: "bi-globe",
        color: "color-green"
      }

    ];


    // =================================
    // RENDER QUIZ CARDS
    // =================================

    const chapterList = document.getElementById("chapterList");

    function renderChapters() {

      chapterList.innerHTML = quizChapters.map(chapter => `

        <a href="quiz.html?id=${chapter.id}"
           class="chapter-card ${chapter.color}">

          <div class="chapter-left">

            <div class="chapter-icon">
              <i class="bi ${chapter.icon}"></i>
            </div>

            <div class="chapter-info">

              <span class="chapter-code">
                CODE: ${chapter.id}
              </span>

              <h6>${chapter.title}</h6>

              <small>${chapter.description}</small>

            </div>

          </div>

          <div class="chapter-arrow">
            <i class="bi bi-arrow-right"></i>
          </div>

        </a>

      `).join("");

    }

    // Initialize
    renderChapters();

  </script>

</body>
</html>
