<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="pb-5">

  <div class="container py-3" style="max-width: 600px;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h5 id="quiz-title" class="fw-bold mb-0">Loading...</h5>
        <small id="quiz-subtitle" class="text-muted">0 questions</small>
      </div>
      <a href="index.html" class="btn btn-sm btn-light rounded-pill border px-3">
        <i class="bi bi-grid me-1"></i>Chapters
      </a>
    </div>

    <!-- Progress & Score Bar -->
    <div class="d-flex align-items-center gap-3 mb-4">
      <div class="progress-track">
        <div id="prog-fill" class="progress-fill" style="width: 0%"></div>
        <div id="prog-thumb" class="progress-thumb" style="left: 0%"></div>
      </div>
      <span id="q-counter" class="fw-semibold text-secondary small">0 / 0</span>
      <span id="wrong-count" class="pill-stat" style="background:#ff8a93; color:#4a0007;">✕ 0</span>
      <span id="right-count" class="pill-stat" style="background:#a3e9a4; color:#0a360c;">✓ 0</span>
    </div>

    <!-- Question & Options Area -->
    <div id="quiz-area"></div>
  </div>

  <!-- Fixed Bottom Navigation -->
  <div class="fixed-bottom bg-transparent py-3">
    <div class="d-flex justify-content-center gap-3">
      <button id="btn-prev" class="nav-pill" style="background:#efefef; color:#222;">Back</button>
      <button id="btn-next" class="nav-pill" style="background:#a8d5f7; color:#0b253a;">Next</button>
    </div>
  </div>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    let questions = [], idx = 0, userAnswers = {};

    async function init() {
      if (!id) return showErr("Chapter ID missing in URL.");
      try {
        const res = await fetch(`data/${id}.json`);
        if (!res.ok) throw 0;
        const data = await res.json();
        questions = data.questions || [];
        document.getElementById("quiz-title").textContent = data.chapterTitle || "Practice Quiz";
        document.getElementById("quiz-subtitle").textContent = `${questions.length} questions`;
        render();
      } catch {
        showErr(`File data/${id}.json not found.`);
      }
    }

    function render() {
      if (!questions.length) return;
      const q = questions[idx];
      const chosen = userAnswers[idx];
      const isAnswered = chosen !== undefined;

      // Update progress & stats
      const pct = ((idx + 1) / questions.length) * 100;
      document.getElementById("prog-fill").style.width = `${pct}%`;
      document.getElementById("prog-thumb").style.left = `${pct}%`;
      document.getElementById("q-counter").textContent = `${idx + 1} / ${questions.length}`;

      let right = 0, wrong = 0;
      Object.entries(userAnswers).forEach(([qIdx, ans]) => {
        ans === questions[qIdx].correctIndex ? right++ : wrong++;
      });
      document.getElementById("right-count").textContent = `✓ ${right}`;
      document.getElementById("wrong-count").textContent = `✕ ${wrong}`;

      // Exam badges
      const exams = (q.exams || []).map(e => `<span class="badge bg-light text-secondary border me-1">${e}</span>`).join("");

      // Options HTML
      const optsHtml = q.options.map((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        const isCorrect = i === q.correctIndex;
        const isUserChoice = i === chosen;

        let badge = "";
        if (isAnswered && isCorrect) badge = `<span class="pill-ans" style="background:#a3e9a4; color:#0a360c;">✓ Correct answer</span>`;
        else if (isAnswered && isUserChoice) badge = `<span class="pill-ans" style="background:#ff8a93; color:#4a0007;">✕ Wrong</span>`;

        const yourTag = (isAnswered && isUserChoice) ? `<span class="text-muted small ms-2">(Your answer)</span>` : "";
        const showExp = isAnswered && (isCorrect || isUserChoice);

        return `
          <div class="opt-card ${isAnswered ? 'answered' : ''}" onclick="selectOpt(${i})">
            <div class="d-flex justify-content-between align-items-center gap-2">
              <div class="d-flex align-items-center gap-2">
                <button type="button" class="opt-dropdown-btn" onclick="toggleExp(event, ${i})" title="Show explanation">
                  <i id="ico-${i}" class="bi bi-chevron-${showExp ? 'up' : 'down'}"></i>
                </button>
                <span class="fw-semibold">${letter}.</span>
                <span>${opt.text}${yourTag}</span>
              </div>
              ${badge}
            </div>
            <div id="exp-${i}" class="opt-exp ${showExp ? '' : 'd-none'}">${opt.explanation}</div>
          </div>`;
      }).join("");

      document.getElementById("quiz-area").innerHTML = `
        <div class="mb-2 d-flex justify-content-between align-items-center">
          <span class="text-secondary fw-semibold">Question ${idx + 1}</span>
          <div>${exams}</div>
        </div>
        <h5 class="fw-bold mb-4 lh-base">${q.question}</h5>
        <div>${optsHtml}</div>
      `;

      document.getElementById("btn-prev").disabled = idx === 0;
      document.getElementById("btn-next").textContent = idx === questions.length - 1 ? "Finish" : "Next";
    }

    function selectOpt(optIdx) {
      if (userAnswers[idx] !== undefined) return;
      userAnswers[idx] = optIdx;
      render();
    }

    function toggleExp(e, optIdx) {
      e.stopPropagation();
      const box = document.getElementById(`exp-${optIdx}`);
      const ico = document.getElementById(`ico-${optIdx}`);
      box.classList.toggle("d-none");
      ico.className = `bi bi-chevron-${box.classList.contains("d-none") ? "down" : "up"}`;
    }

    function showErr(msg) {
      document.getElementById("quiz-area").innerHTML = `<div class="alert alert-danger">${msg}</div>`;
    }

    document.getElementById("btn-prev").onclick = () => { if (idx > 0) { idx--; render(); } };
    document.getElementById("btn-next").onclick = () => { if (idx < questions.length - 1) { idx++; render(); } };

    init();
  </script>
</body>
</html>
