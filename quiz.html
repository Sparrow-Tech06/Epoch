<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-dark bg-primary shadow-sm mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="btn btn-sm btn-light fw-semibold">
        <i class="bi bi-arrow-left me-1"></i>Chapters
      </a>
      <span id="chapter-title" class="text-white fw-bold text-truncate ms-2">Loading...</span>
      <span id="score-badge" class="badge bg-warning text-dark fs-6">Score: 0</span>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 760px;">
    <div id="quiz-container">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Fetching questions...</p>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const chapterId = params.get("id"); // e.g., "100101"

    const quizContainer = document.getElementById("quiz-container");
    const chapterTitleEl = document.getElementById("chapter-title");
    const scoreBadgeEl = document.getElementById("score-badge");

    let score = 0;

    async function loadQuiz() {
      if (!chapterId) {
        showError("No chapter ID specified in the URL.");
        return;
      }

      try {
        const response = await fetch(`data/${chapterId}.json`);
        if (!response.ok) throw new Error("Chapter JSON file not found.");

        const data = await response.json();
        chapterTitleEl.textContent = data.chapterTitle;
        document.title = data.chapterTitle;

        renderQuestions(data.questions);
      } catch (err) {
        showError(`Could not load data for ID: ${chapterId}. Make sure data/${chapterId}.json exists.`);
      }
    }

    function renderQuestions(questions) {
      quizContainer.innerHTML = "";

      questions.forEach((q, qIndex) => {
        const card = document.createElement("div");
        card.className = "card shadow-sm border-0 rounded-4 mb-4";

        // Exam badges HTML
        const examBadges = q.exams
          .map(exam => `<span class="badge bg-secondary-subtle text-secondary me-1 mb-1"><i class="bi bi-patch-check me-1"></i>${exam}</span>`)
          .join("");

        // Options HTML
        const optionsHtml = q.options
          .map((opt, optIndex) => `
            <div class="option-item" data-q="${qIndex}" data-opt="${optIndex}">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <span class="fw-bold me-2">${String.fromCharCode(65 + optIndex)}.</span>
                  <span>${opt.text}</span>
                </div>
                <i class="bi status-icon fs-5"></i>
              </div>
              <div class="explanation-box d-none">
                <i class="bi bi-info-circle me-1"></i>${opt.explanation}
              </div>
            </div>
          `)
          .join("");

        card.innerHTML = `
          <div class="card-body p-4">
            <div class="mb-2">${examBadges}</div>
            <h6 class="fw-bold mb-3 lh-base">Q${qIndex + 1}. ${q.question}</h6>
            <div class="options-group" id="q-group-${qIndex}">
              ${optionsHtml}
            </div>
          </div>
        `;

        quizContainer.appendChild(card);

        // Attach click listeners to options of this question
        const optionElements = card.querySelectorAll(".option-item");
        optionElements.forEach(el => {
          el.addEventListener("click", () => handleAnswer(el, q, optionElements));
        });
      });
    }

    function handleAnswer(selectedEl, questionObj, allOptionEls) {
      // Prevent re-answering
      if (selectedEl.classList.contains("disabled")) return;

      const selectedIndex = parseInt(selectedEl.getAttribute("data-opt"), 10);
      const correctIndex = questionObj.correctIndex;

      if (selectedIndex === correctIndex) {
        score++;
        scoreBadgeEl.textContent = `Score: ${score}`;
      }

      allOptionEls.forEach((el, idx) => {
        el.classList.add("disabled");
        const icon = el.querySelector(".status-icon");
        const expBox = el.querySelector(".explanation-box");

        // Show explanation for EVERY option
        expBox.classList.remove("d-none");

        if (idx === correctIndex) {
          el.classList.add("correct");
          icon.classList.add("bi-check-circle-fill", "text-success");
        } else if (idx === selectedIndex) {
          el.classList.add("wrong");
          icon.classList.add("bi-x-circle-fill", "text-danger");
        }
      });
    }

    function showError(msg) {
      chapterTitleEl.textContent = "Error";
      quizContainer.innerHTML = `
        <div class="alert alert-danger d-flex align-items-center" role="alert">
          <i class="bi bi-exclamation-triangle-fill me-2 fs-4"></i>
          <div>${msg}</div>
        </div>
      `;
    }

    loadQuiz();
  </script>
</body>
  </html>
